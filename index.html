<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesse Agora</title>
  <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <style>
    :root {
      color-scheme: dark;
      --glass: rgba(0, 0, 0, 0.45);
      --ring: rgba(255, 255, 255, 0.22);
    }
    * { box-sizing: border-box; }
        body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #000;
      color: #fff;
    }
        .video-background-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
      overflow: hidden;
        }
        .video-background {
            width: 100%;
            height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0.55;
    }
    @supports (height: 100svh) {
      .video-background-container { height: 100svh; }
    }
    main {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay {
            position: absolute;
            inset: 0;
      background: rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
    #quiz-container {
      position: relative;
      width: 100%;
      max-width: 22rem;
      margin: 0 auto;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    #quiz-container.dim {
      opacity: 0;
      transform: scale(0.96);
    }
    .card {
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 1rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      padding: 1.5rem;
      padding-top: 4rem;
      text-align: center;
      min-height: 22rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid var(--ring);
    }
    #avatar-img {
      width: 6rem;
      height: 6rem;
      border-radius: 999px;
      margin: -4.5rem auto 0;
      border: 4px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            object-fit: cover;
    }
    .online-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .dot {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55);
      animation: ping 1.4s ease-out infinite;
    }
    @keyframes ping {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.45); }
      70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
    .online-label { font-size: 0.875rem; font-weight: 500; color: #86efac; }
    #question-text {
      font-size: 1.125rem;
      font-weight: 500;
      margin: 0.5rem 0 1rem;
      min-height: 5.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.35;
    }
    .btn-row { display: flex; gap: 1rem; justify-content: center; }
    button {
      flex: 1;
      font-weight: 700;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button:active { transform: scale(0.98); }
    .btn-no {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }
    .btn-no:hover { background: rgba(255, 255, 255, 0.28); }
    .btn-yes {
      color: #fff;
      background: linear-gradient(90deg, #ec4899, #fb923c);
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.35);
    }
    .btn-yes:hover { opacity: 0.92; }
    #location-info {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 1rem;
    }
    .hidden { display: none !important; }
    #redirect-content .spinner {
      width: 3rem;
      height: 3rem;
      margin: 0 auto;
      border-radius: 999px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: rgba(255, 255, 255, 0.85);
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #pressel-status-title {
      margin-top: 1rem;
      font-size: 1.05rem;
      font-weight: 600;
    }
    #pressel-status-sub {
      margin-top: 0.35rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.72);
      line-height: 1.35;
      max-width: 22rem;
      margin-left: auto;
      margin-right: auto;
    }
    .spin-inline {
      width: 2rem;
      height: 2rem;
      border-radius: 999px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      animation: spin 0.85s linear infinite;
      margin: 0 auto;
        }
    </style>
</head>
<body>
  <div class="video-background-container" aria-hidden="true">
    <video
      id="bg-video"
      class="video-background"
      muted
      loop
      playsinline
      webkit-playsinline
      preload="none"
      poster="assets/avatar-carol.png"
    >
      <source data-src-local="assets/video-poster.mp4" type="video/mp4" />
      <source data-src-remote="https://s3-cf.zapsafe.work/SEUTROQUEAQUI/videofundo2.mp4" type="video/mp4" />
        </video>
    </div>

  <main>
    <div class="overlay" aria-hidden="true"></div>
    <div id="quiz-container">
      <div class="card">
        <img id="avatar-img" src="assets/avatar-carol.png" alt="Foto de Joany" width="96" height="96" decoding="async" fetchpriority="high" />

                <div id="quiz-content">
          <div class="online-row">
            <span class="dot" aria-hidden="true"></span>
            <span class="online-label">Joany está online...</span>
                    </div>
          <p id="question-text">
            <span class="spin-inline" aria-label="Carregando"></span>
          </p>
          <div class="btn-row">
            <button type="button" id="no-btn" class="btn-no">Não</button>
            <button type="button" id="yes-btn" class="btn-yes">Sim</button>
                    </div>
          <div id="location-info"></div>
                </div>

                <div id="redirect-content" class="hidden">
          <div class="spinner" aria-hidden="true"></div>
          <p id="pressel-status-title">Abrindo Telegram…</p>
          <p id="pressel-status-sub"></p>
                </div>
            </div>
        </div>
    </main>

  <script>
    (function loadFacebookPixelDeferred() {
      var pixelIdLanding = "1032225729043782";
      var pixelIdQuizComplete = "724620673521299";
      function boot() {
        if (window.fbq) return;
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = "2.0";
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
        fbq("init", pixelIdLanding);
        fbq("init", pixelIdQuizComplete);
        fbq("trackSingle", pixelIdLanding, "PageView");
      }
      window.__fireQuizCompletePageView = function () {
        try {
          if (typeof fbq !== "function") return;
          fbq("trackSingle", pixelIdQuizComplete, "PageView");
        } catch (e) {}
      };
      if ("requestIdleCallback" in window) {
        requestIdleCallback(function () {
          boot();
        }, { timeout: 2500 });
      } else {
        window.addEventListener("load", function () {
          setTimeout(boot, 400);
        });
      }
    })();

        const quizData = [
            {
                question: "Joany está online agora, vamos conversar ?",
        avatar: "assets/avatar-carol.png",
            },
            {
                question: "Eu realmente respondo, mas não gosto de perder tempo atoa. Você vai me dar atenção?",
        avatar: "assets/avatar-carol.png",
            },
            {
                question: "Eu quero te mostrar umas coisinhas 🔞😈, posso? 😏",
        avatar: "assets/avatar-carol.png",
      },
        ];
        let currentQuestionIndex = 0;
    const quizContainer = document.getElementById("quiz-container");
    const questionText = document.getElementById("question-text");
    const avatarImg = document.getElementById("avatar-img");
    const yesBtn = document.getElementById("yes-btn");
    const noBtn = document.getElementById("no-btn");
    const locationInfo = document.getElementById("location-info");
    const quizContent = document.getElementById("quiz-content");
    const redirectContent = document.getElementById("redirect-content");

        function showQuestion(index) {
            questionText.textContent = quizData[index].question;
            avatarImg.src = quizData[index].avatar;
      avatarImg.alt = "Avatar para a pergunta " + (index + 1);
    }

    function maybeStartBackgroundVideo() {
      var v = document.getElementById("bg-video");
      if (!v || v.dataset.prepared === "1") return;
      v.dataset.prepared = "1";
      var local = v.querySelector("source[data-src-local]");
      var remote = v.querySelector("source[data-src-remote]");
      if (local && local.getAttribute("data-src-local")) local.src = local.getAttribute("data-src-local");
      if (remote && remote.getAttribute("data-src-remote")) remote.src = remote.getAttribute("data-src-remote");
      try {
        v.load();
      } catch (e) {}
      v.muted = true;
      v.defaultMuted = true;
      v.loop = true;
      v.playsInline = true;
      var p = v.play && v.play();
      if (p && typeof p.catch === "function") p.catch(function () {});
        }

        function startRedirect() {
      maybeStartBackgroundVideo();
      quizContent.classList.add("hidden");
      redirectContent.classList.remove("hidden");
      document.getElementById("pressel-status-title").textContent = "Abrindo Telegram…";
      document.getElementById("pressel-status-sub").textContent = "";
      if (typeof window.__fireQuizCompletePageView === "function") window.__fireQuizCompletePageView();
      setTimeout(function () {
        window.location.replace("https://t.me/Joany_Limabot");
      }, 200);
        }

        function handleAnswer() {
      maybeStartBackgroundVideo();
            if (currentQuestionIndex === quizData.length - 1) {
                startRedirect();
                return;
            }
      quizContainer.classList.add("dim");
      setTimeout(function () {
                currentQuestionIndex++;
                showQuestion(currentQuestionIndex);
        quizContainer.classList.remove("dim");
      }, 450);
    }

    yesBtn.addEventListener("click", handleAnswer);
    noBtn.addEventListener("click", handleAnswer);

    window.addEventListener("load", function () {
      quizContainer.style.opacity = "0";
      var minKm = 5;
      var maxKm = 31;
      var randomKm = Math.floor(Math.random() * (maxKm - minKm + 1)) + minKm;
      locationInfo.textContent =
        "📍 Perto de você! Na sua região, a somente " + randomKm + " km disponível para conversar";
            showQuestion(currentQuestionIndex);
      requestAnimationFrame(function () {
        quizContainer.style.opacity = "1";
      });
    });

    if ("requestIdleCallback" in window) {
      requestIdleCallback(
        function () {
          maybeStartBackgroundVideo();
        },
        { timeout: 4000 }
      );
    }
    </script>
</body>
</html>
